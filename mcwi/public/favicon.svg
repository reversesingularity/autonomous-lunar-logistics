<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#9e9e9e"/>
    </linearGradient>
  </defs>
  <!-- Earth -->
  <circle cx="10" cy="16" r="8" fill="url(#earthGrad)"/>
  <!-- Moon -->
  <circle cx="26" cy="16" r="4" fill="url(#moonGrad)"/>
  <!-- Trajectory -->
  <path d="M18 16 L22 16" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2,1"/>
  <!-- Ship -->
  <circle cx="20" cy="16" r="1.5" fill="#06b6d4"/>
