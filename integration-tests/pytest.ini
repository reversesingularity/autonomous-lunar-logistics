[pytest]
# Integration Test Configuration for Autonomous Lunar Logistics

# Test discovery
testpaths = contract-validation
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Markers for test categorization
markers =
    contract: Contract validation tests between segments
    telemetry: Telemetry data flow tests
    safety: Safety boundary validation tests
    integration: Full integration tests
    slow: Tests that take longer to run
    critical: Critical path tests that must pass

# Timeout settings (in seconds)
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration (when running with coverage)
[coverage:run]
branch = true
source = .
omit = 
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
